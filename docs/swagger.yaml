            - $ref: '#/definitions/pkg.Response'
            - properties:
                error:
                  type: string
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                error:
                  type: string
              type: object
      summary: Retrieve available seats for a cinema
      tags:
      - Seats
  /order/ticket:
    get:
      consumes:
      - multipart/form-data
      description: Get ticket information based on a transaction ID.
      parameters:
      - description: Transaction ID
        in: query
        name: transaction_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ticket details retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Ticket'
              type: object
        "400":
          description: Invalid input
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                error:
                  type: string
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                error:
                  type: string
              type: object
      summary: Retrieve ticket details for a transaction
      tags:
      - Tickets
  /order/transactions:
    post:
      consumes:
      - multipart/form-data
      description: Process a payment for a given transaction ID and update its status.
      parameters:
      - description: User ID
        in: formData
        name: user_id
        required: true
        type: integer
      - description: Movie ID
        in: formData
        name: movie_id
        required: true
        type: integer
      - description: Cinema ID
        in: formData
        name: cinema_id
        required: true
        type: integer
      - description: 'Date (format: YYYY-MM-DD)'
        in: formData
        name: date
        required: true
        type: string
      - description: 'Time (format: HH:mm:ss)'
        in: formData
        name: time
        required: true
        type: string
      - description: Location
        in: formData
        name: location
        required: true
        type: string
      - collectionFormat: multi
        description: Seat Numbers
        in: formData
        items:
          type: string
        name: seat_numbers[]
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Transaction created successfully
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Invalid input
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                error:
                  type: string
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                error:
                  type: string
              type: object
      summary: Process a payment for a transaction
      tags:
      - Transactions
